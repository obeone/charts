apiVersion: v2
appVersion: v1.9.6
description: Free and Open Source Machine Translation API. Self-hosted, offline capable and easy to setup.
name: libretranslate
version: 2.0.0
kubeVersion: ">=1.31.0-0"
keywords:
  - libretranslate
  - machine translation
  - self-hosted
  - open-source
  - offline capable
  - translation
  - translator
  - api
home: https://github.com/LibreTranslate/LibreTranslate
icon: https://raw.githubusercontent.com/obeone/charts/main/logo/libretranslate.svg
dependencies:
  - name: common
    repository: https://bjw-s-labs.github.io/helm-charts
    version: 5.1.0
annotations:
  artifacthub.io/signKey: |
    fingerprint: B9FE852F28888D27F8C9A11CD33E04CD22E335CE
    url: https://raw.githubusercontent.com/obeone/charts/main/public_key.gpg
  artifacthub.io/maintainers: |
    - name: obeone
      email: obeone@obeone.org
  artifacthub.io/changes: |
    - kind: changed
      description: >-
        Migrate to bjw-s common 5.1.0 (from 3.7.1); raises the floor to
        Kubernetes >= 1.31 and Helm >= 3.18. The controller selector label
        changes from app.kubernetes.io/component to
        app.kubernetes.io/controller, which is immutable on an existing
        Deployment: `helm upgrade` from a pre-2.0.0 release will fail unless
        you delete the Deployment (not the PVC) before upgrading. The models
        share PVC keeps its `<release>-share` name across the migration,
        via an explicit persistence suffix; no action needed on your side
    - kind: changed
      description: Regenerate README from the unified helm-docs template
    - kind: added
      description: Add a disabled Gateway API HTTPRoute example mirroring the Ingress
