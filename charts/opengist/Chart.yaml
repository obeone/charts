apiVersion: v2
name: opengist
version: 2.0.0
appVersion: 1.15.2
kubeVersion: ">=1.31.0-0"

description: >-
  Opengist is a self-hosted Pastebin powered by Git.
  All snippets are stored in a Git repository and can be read and/or modified using standard Git commands,
  or with the web interface. It is similar to GitHub Gist, but open-source and self-hosted.

keywords:
  - opengist
  - git
  - pastebin
  - gist
  - self-hosted
  - open-source

sources:
  - https://github.com/thomiceli/opengist
  - https://github.com/obeone/charts/tree/main/charts/opengist

home: https://github.com/thomiceli/opengist
icon: https://raw.githubusercontent.com/obeone/charts/main/logo/opengist.svg

maintainers:
  - name: obeone
    email: obeone@obeone.org

dependencies:
  - name: common
    repository: https://bjw-s-labs.github.io/helm-charts
    version: 5.1.0

annotations:
  artifacthub.io/signKey: |
    fingerprint: B9FE852F28888D27F8C9A11CD33E04CD22E335CE
    url: https://raw.githubusercontent.com/obeone/charts/main/public_key.gpg
  artifacthub.io/maintainers: |
    - name: obeone
      email: obeone@obeone.org
  artifacthub.io/changes: |
    - kind: changed
      description: >-
        Migrate to bjw-s common 5.1.0 (from 3.7.1); raises the floor to
        Kubernetes >= 1.31 and Helm >= 3.18. The controller selector label
        changes from app.kubernetes.io/component to
        app.kubernetes.io/controller, which is immutable on an existing
        Deployment: `helm upgrade` from a pre-2.0.0 release will fail unless
        you delete the Deployment before upgrading
    - kind: changed
      description: Update Opengist to 1.15.2
    - kind: changed
      description: Update Opengist to 1.15.1
    - kind: changed
      description: Update Opengist to 1.15.0
    - kind: added
      description: Add a disabled Gateway API HTTPRoute example mirroring the Ingress
