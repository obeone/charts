apiVersion: v2
name: firecrawl
version: 2.1.1
appVersion: "2.11.198"
kubeVersion: ">=1.25.0-0"

description: >-
  Firecrawl is an open-source API that crawls websites and turns them into
  LLM-ready data (markdown, HTML, structured JSON), with an optional MCP
  server exposing its tools at /v2/mcp. This chart packages the self-hosted
  topology — API, workers, Playwright renderer and the bundled Redis /
  RabbitMQ / NuQ-Postgres backends — using the bjw-s common library and
  official ghcr.io images.

type: application

keywords:
  - firecrawl
  - web-scraping
  - crawling
  - llm
  - markdown
  - ai
  - self-hosted
  - mcp

home: https://www.firecrawl.dev
icon: https://raw.githubusercontent.com/firecrawl/firecrawl/main/img/firecrawl_logo.png
sources:
  - https://github.com/firecrawl/firecrawl
  - https://docs.firecrawl.dev
  - https://github.com/obeone/charts/tree/main/charts/firecrawl

maintainers:
  - name: obeone
    email: obeone@obeone.org

dependencies:
  - name: common
    repository: https://bjw-s-labs.github.io/helm-charts
    version: 4.6.2

