apiVersion: v2
name: transfer.sh
version: 2.0.0
appVersion: v1.6.1
description: |
  High-performance, secure and user-friendly command-line file sharing tool.
  Easily upload, share and manage files directly from the browser and the terminal with support for configurable storage backends and access controls.
home: https://github.com/dutchcoders/transfer.sh
sources:
  - https://github.com/dutchcoders/transfer.sh
  - https://github.com/obeone/charts/tree/main/charts/transfer.sh
icon: https://raw.githubusercontent.com/obeone/charts/main/logo/transfer.sh.jpg
keywords:
  - transfer.sh
  - file sharing
  - cli
  - command-line
  - transfer
  - share
  - upload
  - download
  - storage
maintainers:
  - name: obeone
    email: obeone@obeone.org
kubeVersion: ">=1.31.0-0"
dependencies:
  - name: common
    repository: https://bjw-s-labs.github.io/helm-charts
    version: 5.1.0
