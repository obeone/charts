apiVersion: v2
name: sabnzbd
version: 1.0.0
appVersion: 5.1.3
kubeVersion: ">=1.31.0-0"

description: >-
  SABnzbd — a free and open-source binary newsreader (Usenet downloader) with a
  web interface. This Helm chart packages the rootless home-operations image
  using the bjw-s common library, so behaviour is driven almost entirely from
  *values.yaml*.

type: application

keywords:
  - sabnzbd
  - usenet
  - nzb
  - downloader
  - media
  - self-hosted

home: https://sabnzbd.org/
icon: https://raw.githubusercontent.com/obeone/charts/main/logo/sabnzbd.svg
sources:
  - https://github.com/sabnzbd/sabnzbd
  - https://github.com/home-operations/containers/tree/main/apps/sabnzbd
  - https://github.com/obeone/charts/tree/main/charts/sabnzbd

maintainers:
  - name: obeone
    email: obeone@obeone.org

dependencies:
  - name: common
    repository: https://bjw-s-labs.github.io/helm-charts
    version: 5.1.0

annotations:
  artifacthub.io/links: |
    - name: Upstream Project
      url: https://github.com/sabnzbd/sabnzbd
    - name: Container Image
      url: https://github.com/home-operations/containers/pkgs/container/sabnzbd
  artifacthub.io/maintainers: |
    - name: obeone
      email: obeone@obeone.org
  artifacthub.io/changes: |
    - kind: added
      description: Initial release packaging SABnzbd 5.1.3 on the bjw-s common library 5.1.0
